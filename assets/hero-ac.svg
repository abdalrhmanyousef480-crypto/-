<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="unitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEFF9"/>
    </linearGradient>
    <linearGradient id="airGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43B0E6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#43B0E6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- wall bracket -->
  <rect x="60" y="60" width="360" height="86" rx="22" fill="url(#unitGrad)" stroke="#B9DDF0" stroke-width="2"/>
  <!-- front vent slats -->
  <rect x="86" y="118" width="308" height="14" rx="7" fill="#9FCBE6"/>
  <rect x="86" y="100" width="308" height="10" rx="5" fill="#C7E5F4"/>
  <!-- display -->
  <rect x="330" y="76" width="46" height="16" rx="8" fill="#0B2739"/>
  <text x="353" y="88" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#43B0E6">22&#176;C</text>
  <!-- brand dot -->
  <circle cx="96" cy="82" r="5" fill="#1C86BE"/>

  <!-- airflow sweeps -->
  <g fill="none" stroke-linecap="round">
    <path d="M100 150 C160 172, 220 172, 260 196 C300 220, 340 220, 400 244" stroke="url(#airGrad)" stroke-width="10" opacity="0.9"/>
    <path d="M110 178 C170 198, 230 198, 270 222 C310 246, 350 246, 390 268" stroke="url(#airGrad)" stroke-width="7" opacity="0.65"/>
    <path d="M120 204 C175 222, 225 222, 260 244 C300 268, 330 268, 370 288" stroke="url(#airGrad)" stroke-width="5" opacity="0.45"/>
  </g>

  <!-- snowflake particles -->
  <g stroke="#1C86BE" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <g transform="translate(230,250)"><path d="M0,-9 0,9 M-8,-5 8,5 M-8,5 8,-5"/></g>
    <g transform="translate(310,286) scale(0.7)"><path d="M0,-9 0,9 M-8,-5 8,5 M-8,5 8,-5"/></g>
    <g transform="translate(170,232) scale(0.55)"><path d="M0,-9 0,9 M-8,-5 8,5 M-8,5 8,-5"/></g>
  </g>
</svg>
